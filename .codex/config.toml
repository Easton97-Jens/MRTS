#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "on-request"
sandbox_mode = "workspace-write"
allow_login_shell = false
project_doc_max_bytes = 65536

[features]
hooks = false
multi_agent = true
shell_snapshot = true
memories = false

[agents]
max_concurrent_threads_per_session = 6
max_depth = 2
interrupt_message = true
job_max_runtime_seconds = 3600

[sandbox_workspace_write]
network_access = true
writable_roots = [
    "/var/tmp/codex/MRTS",
    "/var/tmp/codex/worktrees/mrts",
    "/root/.local/share/rtk",
    "/root/.local/bin/"
]
exclude_slash_tmp = true
exclude_tmpdir_env_var = false

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false
exclude = [
    "AWS_*",
    "AZURE_*",
    "GOOGLE_*",
    "GCP_*",
    "OPENAI_API_KEY",
    "CODEX_API_KEY",
    "CODEX_ACCESS_TOKEN",
    "GITHUB_TOKEN",
    "GH_TOKEN",
    "GITHUB_MCP_TOKEN",
    "*PASSWORD*",
    "*PRIVATE_KEY*",
]

[shell_environment_policy.set]
PROJECT_ROOT = "/root/git/ModSecurity-conector/modules/ModSecurity-test-Framework/tools/MRTS"
MRTS_ROOT = "/root/git/ModSecurity-conector/modules/ModSecurity-test-Framework/tools/MRTS"
FRAMEWORK_ROOT = "/root/git/ModSecurity-conector/modules/ModSecurity-test-Framework"
CONNECTOR_ROOT = "/root/git/ModSecurity-conector"

CODEX_PROJECT_STATE = "/var/tmp/codex/MRTS"
CODEX_TEMP_ROOT = "/var/tmp/codex/MRTS"
CODEX_RUN_ROOT = "/var/tmp/codex/MRTS/runs"
STATE_HOME = "/var/tmp/codex/MRTS/state"
SOURCE_ROOT = "/var/tmp/codex/MRTS/source"
BUILD_ROOT = "/var/tmp/codex/MRTS/build"
TMP_ROOT = "/var/tmp/codex/MRTS/tmp"
TMPDIR = "/var/tmp/codex/MRTS/tmp"
TMP = "/var/tmp/codex/MRTS/tmp"
TEMP = "/var/tmp/codex/MRTS/tmp"
LOG_ROOT = "/var/tmp/codex/MRTS/logs"
CACHE_ROOT = "/var/tmp/codex/MRTS/cache"
ANALYSIS_ROOT = "/var/tmp/codex/MRTS/analysis"
EVIDENCE_ROOT = "/var/tmp/codex/MRTS/evidence"
MATRIX_ROOT = "/var/tmp/codex/MRTS/matrix"
MRTS_BUILD_ROOT = "/var/tmp/codex/MRTS/build"
OUTPUT_ROOT = "/var/tmp/codex/MRTS/output"

MRTS_GOVERNANCE_WORKTREE_ROOT = "/var/tmp/codex/worktrees/mrts"
MRTS_GOVERNANCE_PYTHON_VERSION = "3.14.6"

VIRTUAL_ENV = "/var/tmp/codex/MRTS/venv"
PYTHON = "/var/tmp/codex/MRTS/venv/bin/python"
PYTHONPYCACHEPREFIX = "/var/tmp/codex/MRTS/cache/pycache"
PYTHONNOUSERSITE = "1"
PYTHONDONTWRITEBYTECODE = "1"
PIP_REQUIRE_VIRTUALENV = "true"
PIP_DISABLE_PIP_VERSION_CHECK = "1"

CODEX_STORAGE_WARN_GIB = "80"
CODEX_STORAGE_NORMAL_BUDGET_GIB = "100"
CODEX_STORAGE_HARD_LIMIT_GIB = "140"
CODEX_STORAGE_MIN_FREE_START_GIB = "50"
CODEX_STORAGE_MIN_FREE_RUNTIME_GIB = "30"
CODEX_STORAGE_FINAL_TARGET_GIB = "100"
CODEX_CLEANUP_ARCHIVE_ROOT = "/var/tmp/codex/MRTS/archives"

PAGER = "cat"
GIT_PAGER = "cat"
